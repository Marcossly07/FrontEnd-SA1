<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fornecedor</title>
    <link rel="stylesheet" href="../static/fornecedor.css">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
</head>

<body>
    <!-- estrutura base das paginas  -->
    <aside class="sidebar">
        <span class="material-symbols-outlined menu-icon">
            menu
        </span>
        <a href="../index.html" class="nav-item ativo">
            <span class="material-symbols-outlined">
                home
            </span>
        </a>
        <a href="../templates/cadastro.html" class="nav-item">
            <span class="material-symbols-outlined">
                folder
            </span>
        </a>
        <a href="../templates/entradas-e-saidas.html" class="nav-item">
            <span class="material-symbols-outlined">
                assignment
            </span>
        </a>
    </aside>
    <div class="main-container">
        <header class="topbar">
            <div class="logo">
                <span class="material-symbols-outlined">
                    settings
                </span>
                <img class="logo" src="../img/logo-dda.png" alt="logo">
            </div>

            <div class="search-box">
                <input placeholder="Pesquisar..." type="text">
                <span class="material-symbols-outlined">
                    search
                </span>
            </div>

            <div class="user-menu">
                <div class="badge-icon">
                    <span class="material-symbols-outlined">
                        notifications
                    </span>
                    <span class="count">
                        1
                    </span>
                </div>
                <div style="display: flex; align-items: center; gap: 4px; cursor: pointer;">
                    <span class="material-symbols-outlined">account_circle</span>
                    <span class="material-symbols-outlined" style="font-size: 16px;">arrow_drop_down</span>
                </div>
                <span class="material-symbols-outlined" style="cursor: pointer;">logout</span>
            </div>
        </header>
        <!-- estrutura base das paginas.  -->

        <main id="display-content">
            <div id="area-interacao">
                <h1 id="titulo">Cadastro de Fornecedor</h1>
                <div id="area-form">
                    <br>
                    <form action="https://6ab95468f84897980b728b5b.mockapi.io/api/fornecedor" method="post" id="forms">

                        <div class="form-group">
                            <label for="nome">Nome do Fornecedor:</label>
                            <br>
                            <input type="text" name="nome" id="nome" placeholder="Ex: W Fer Ferramentas" required>
                        </div>
                        <br>
                        <hr>
                        <br>
                        <div id="row">
                            <div class="form-group">
                                <label for="cnpj">CNPJ:</label>
                                <input type="text" id="cnpj" name="cnpj" placeholder="Ex: 35.290.702/0001-31 " required>
                            </div>
                            <div class="form-group">
                                <label for="telefone">Telefone: </label>
                                <input type="tel" id="telefone" name="telefone" placeholder="EX: (62) 3586-5146" required>
                            </div>
                            <div class="form-group">
                                <label for="email">E-mail:</label>
                                <input type="email" id="email" name="email" placeholder="Ex: exemplo@gmail.com" required>
                            </div>
                            <button type="submit" id="btn-confirm">Adicionar</button>
                        </div>
                        <hr>
                        <br>
                        <div id="row-filtro">
                            <div class="form-group">
                                <label for="filtro">Filtro:</label>
                                <input type="text" id="filtro" name="filtro">
                            </div>
                            <button type="button" id="btn-filtro">Filtrar</button>
                        </div>
                        <br>
                        <hr>
                        <br>
                        <table>
                            <thead>
                                <tr>
                                    <th>Fornecedor</th>
                                    <th>CNPJ</th>
                                    <th>Telefone</th>
                                    <th>E-mail</th>
                                </tr>
                            </thead>
                            <tbody id="body-table">
                            </tbody>
                        </table>
                    </form>
                </div>
            </div>
        </main>
    </div>
    <script src="../scripts/fornecedor.js"></script>
</body>
</html>
