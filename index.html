<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="../static/login.css">
</head>

<body>

    <main class="login-card">
<div>
    <p class="dda">DDA</p>
    <h2 class="titulo">stock system</h2>
</div>

        <div class="avatar">
            <svg viewBox="0 0 140 140">
                <circle cx="70" cy="70" r="70" fill="#adadadcc"/>
                <path d="M45 45c0-19 11-30 25-30s25 11 25 30v12c0 18-10 33-25 33S45 75 45 57z" fill="#1c3155"/>
                <path d="M50 84c-3 12-8 17-18 20-13 4-20 10-23 21h122c-3-11-10-17-23-21-10-3-15-8-18-20z" fill="#1c3155"/>
            </svg>
        </div>

        <form class="login-form">

            <label class="input-row">
                <span class="icon"></span>
                <input type="name" id="usuario" placeholder="Usuario" required>
            </label>

            <label class="input-row">
                <span class="icon"></span>
                <input type="password" id="senha" placeholder="Senha" required>
            </label>

            <div class="form-options">

                <label class="remember">
                    <input type="checkbox" checked>
                    <span>Lembre-se de mim neste dispositivo!</span>
                </label>

                
            </div>
            
        </form>
        <a href="../templates/home.html"><button>LOGIN</button></a>
    </main>
<div>
    <p class="Grupo">Grupo</p>
    <p class="Overl">Overlords</p>
    </div>
<script src="../scripts/login.js"></script>
</body>
</html>
