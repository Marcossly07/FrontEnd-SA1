<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Entradas e saídas</title>
</head>
<body>
    <header>
        <nav><h1>Histórico</h1></nav>
    </header>
    <main>
        <section class="filtro">
            <form>
                <input type="number" placeholder="Id">
                <input type="text" placeholder="Nome">
                <input type="number" placeholder="Quantidade">
                <input type="number" placeholder="Preço">
                <button type="submit">Buscar</button>
            </form>
            <table border="1">
                <thead>
                    <tr>
                        <th>Id</th>
                        <th>Nome</th>
                        <th>Quantidade</th>
                        <th>Preço</th>
                        <th>Função</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>1</td>
                        <td>Classe K</td>
                        <td>10</td>
                        <td>R$5.000,00</td>
                        <td><button>Vender</button></td>
                    </tr>
                    <tr class="pouca_quantidade">
                        <td>31</td>
                        <td>Classe K</td>
                        <td>1</td>
                        <td>R$500,00</td>
                        <td><button>Solicitar</button></td>
                    </tr>
                    <tr>
                        <td>33</td>
                        <td>Classe K</td>
                        <td>4</td>
                        <td>R$2.000,00</td>
                        <td><button>Vender</button></td>
                    </tr>
                    <tr>
                        <td>40</td>
                        <td>Classe K</td>
                        <td>12</td>
                        <td>R$6.000,00</td>
                        <td><button>Vender</button></td>
                    </tr>
                </tbody>
            </table>
        </section>
    </main>
</body>
</html>
