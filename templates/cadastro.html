<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="/static/cadastro.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <Header class="cabecalho">
        <a class="fa-solid fa-house" href="/index.html">  ←</a>
        <h1>Cadastro/Retirada</h1>
    </Header>
    <main class="main">
        
        <div class="area-de-interacao">
            <form id="cadastro">
                <label for="cadastrante">Cadastrante:</label>
                <br>
                <input type="text" name="cadastrante" id="cadastrante" placeholder="Digite o nome do cadastrante" required>
                <br><br>
                <label for="senha">Senha:</label>
                <br>
                <input type="password" name="senha" id="senha" placeholder="Digite a senha" required>
                <br><br>
                <label for="quantidade">Quantidade(pacote):</label>
                <br>
                <input type="number" min="1" max="100" name="quantidade" id="quantidade" placeholder="UND" required>
                <br><br>
                <label for="fornecedor">Fornecedor:</label>
                <br>
                <select id="fornecedor" name="fornecedor">
                    <option>Sandvik Coromant</option>
                    <option>Widia</option>
                    <option>Mitsubishi Materials</option>
                    <option>ZCC-CT</option>
                </select>
                <br><br>
                <label for="classe">Classe:</label>
                <br>
                <select name="classe" id="classe">
                    <option >P</option>
                    <option >M</option>
                    <option >K</option>
                    <option >N</option>
                    <option >S</option>
                    <option >H</option>
                </select>
                <br><br>
                
            </form>
            <div class="cheque">
                <img src="/img/logo-dda.png" alt="" width="100" height="50">
                <p>Cadastrante: Fulano</p>
                <p>Data: 28/08/2026</p>
                <p>Quantidade: 50UNDs</p>
                <p>Valor: R$6.000,00</p>
                <p>Fornecedor: Sandvik Coromant</p>
                <p>Classe: P</p>
                <p>Tipo: Cadastro</p>
            </div>

            <form >
                <label for="solicitacao">Tipo:</label>
                <select id="solicitacao" name="solicitacao">
                    <option>Cadastro</option>
                    <option>Retirada</option>
                    
                </select>
                <button>Finalizar</button>
            </form>
        </div>
    </main>
    <script src="/scripts/cadastro.js"></script>
</body>

</html>
