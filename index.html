<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela inicial DDA</title>
    <link rel="stylesheet" href="static/style.css">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />

</head>

<body>

    <aside class="sidebar">

        <div class="logo">
            <img src="" alt="Logo do sistema" class="logo">
             <h1 class="sys"></h1>
        </div>
        <a href="/index.html">
            <svg viewBox="0 0 24 24">
                <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z" />
            </svg>
            <span>Início</span>
        </a>

        <a href="/templates/cadastro.html">
            <svg viewBox="0 0 24 24">
                <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z" />
            </svg>
            <span>Cadastro</span>
        </a>

        <a href="/templates/fornecedor.html">
            <svg viewBox="0 0 24 24">
                <path
                    d="M13 3a9 9 0 0 0-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42A8.954 8.954 0 0 0 13 21a9 9 0 0 0 0-18zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z" />
            </svg>
            <span>Histórico</span>
        </a>

        <a href="/templates/fornecedor.html" class="logout">
            <svg viewBox="0 0 24 24">
                <path
                    d="M20 8h-3V4H3c-1.1 0-2 .9-2 2v11h2a3 3 0 0 0 6 0h6a3 3 0 0 0 6 0h2v-5l-3-4zm-3 1h2.5l2 3H17V9zM6 18.5a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zm12 0a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3z" />
            </svg>
            <span>Cadastrar <br> Fornecedores</span>
        </a>


        <a href="/templates/login.html" class="logout">
            <svg viewBox="0 0 24 24">
                <path
                    d="M10.09 15.59L11.5 17l5-5-5-5-1.41 1.41L12.67 11H3v2h9.67l-2.58 2.59zM19 3H5c-1.11 0-2 .9-2 2v4h2V5h14v14H5v-4H3v4c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2z" />
            </svg>
            <span>Saída</span>
        </a>
        </nav>
    </aside>

    <div class="main-container">
        <header class="topbar">
            <div class="search-box">
                <input placeholder="Pesquisar..." type="text" id="pesquisa">
                <div id="resultado"></div>
                <div id="infoProduto"></div>
                <span class="material-symbols-outlined">
                    search
                </span>
            </div>

            <div class="user-menu">
                <div class="badge-icon">
                    <span class="material-symbols-outlined">
                        notifications
                    </span>
                    <span class="count">
                        1
                    </span>
                </div>
                <div style="display: flex; align-items: center; gap: 4px; cursor: pointer;">
                    <span class="material-symbols-outlined">account_circle</span>
                    <span class="material-symbols-outlined" style="font-size: 16px;">arrow_drop_down</span>
                </div>
            </div>
        </header>

        <!-- parte do meio de cima dos botões grandes -->
        <main class="dashboard-content">

            <!-- os  botões grande do meio-->
            <div class="cards-grid">

                <div class="card card-cinza" title="Itens Cadastrados">
                    <div class="title-c">TOTAL DE PASTILHAS</div>
                    <div class="value" id="quantidade">0</div>
                    <div class="subtitle green">___________ 70%</div>
                </div>

                <div class="card card-vermelho" title="Alerta de estoque">
                    <div class="title-v">ALERTA DE ESTOQUE MINIMO</div>
                    <div class="value" id="alerta_de_estoque_min">12</div>
                    <div class="subtitle">___________ pastilha de freio</div>
                </div>

                <div class="card card-azul" title="Dados">
                    <div class="title-a">DADOS DE ESTOQUE</div>
                    <div class="main-text" style="font-size: 28px;"></div>
                    <svg class="graph-line" viewBox="0 0 100 40">
                        <polyline points="0,30 30,30 50,10 70,20 95,5" fill="none" stroke="#76ff03" stroke-width="3" />
                        <polyline points="85,5 95,5 95,15" fill="none" stroke="#76ff03" stroke-width="3" />
                    </svg>
                </div>

                <div class="card card-amarelo" title="Altas">
                    <div class="title-am">
                        PASTILHAS EM ALTA
                    </div>
                    <div class="main-text">
                        PASTILHAS DE CERÂMICA</div>
                    <div class="subtitle black">
                        _____________ 10,3%
                    </div>
                </div>

                <div class="card card-verde" title="Alto nivel de estoque">
                    <div class="title-d">
                        Fornecedores
                    </div>
                    <div class="main-text" id="fornecedores">0</div>
                    <div>
                    </div>
                </div>

            </div>

            <!-- parte branca de baixo, vou colocar os graficos -->
            <div class="parte-branca-do-meio">


            </div>

        </main>
    </div>
    <script src="../scripts/index.js"></script>
</body>

</html>
