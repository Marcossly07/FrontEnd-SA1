<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pastilhas</title>
    <link rel="stylesheet" href="../static/pastilha.css">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
</head>

<body>
    <!-- Menu do lado -->
    <aside class="sidebar">
        <span class="material-symbols-outlined menu-icon">
            menu
        </span>
        <a href="../index.html" class="nav-item ativo" title="inicio" id="simbolo-1">
            <span class="material-symbols-outlined">
                home
            </span>
        </a>
        <a href="../templates/cadastro.html" class="nav-item" title="cadastro" id="simbolo-2">
            <span class="material-symbols-outlined">
                edit_document
            </span>
        </a>
        <a href="../templates/entradas-e-saidas.html" class="nav-item" title="Historico" id="simbolo-3">
            <span class="material-symbols-outlined">
                overview
            </span>
        </a>
         <a href="../templates/fornecedor.html" class="nav-item" title="Cadastrar fornecedor" id="simbolo-4">
           <span class="material-symbols-outlined">
                 local_shipping
            </span>
        </a>
    </aside>
    <div class="main-container">
        <header class="topbar">
            <div class="logo">
                <span class="material-symbols-outlined">
                    settings
                </span>
            </div>
            <div class="user-menu">
                <div class="badge-icon">
                    <span class="material-symbols-outlined">
                        notifications
                    </span>
                    <span class="count">
                        1
                    </span>
                </div>
                <div style="display: flex; align-items: center; gap: 4px; cursor: pointer;">
                    <span class="material-symbols-outlined">account_circle</span>
                    <span class="material-symbols-outlined" style="font-size: 16px;">arrow_drop_down</span>
                </div>
                <span class="material-symbols-outlined" style="cursor: pointer;">logout</span>
            </div>
        </header>
        <!-- estrutura base das paginas.  -->

        <main id="display-content">
            <div id="area-interacao">
                <h1 id="titulo">Cadastro de Pastilha</h1>
                <div id="area-form">
                    <br>
                    <label for="id">Id interno:</label>
                    <form id="forms">

                        <div class="form-group">
                            <br>
                            <input type="text" name="id" id="id" placeholder="Ex:PAS-99999" pattern="PAS-[0-9]{5}" title="Digite o ID interno no formato PAS-99999" required>
                        </div>
                        <br>
                        <hr>
                        <br>
                        <div class="row">
                            <div class="form-group">
                                <label for="codigo">Codigo (ISO):</label>
                                <input type="text" id="codigo" name="codigo" placeholder="Ex: CNMG 120408" required>
                            </div>
                            <div class="form-group">
                                <label for="classe">Classe:</label>
                                <select name="classe" id="classe" required>
                                    <option value="P">P - Aços</option>
                                    <option value="M">M - Inoxidáveis</option>
                                    <option value="K">K - Ferros fundidos</option>
                                    <option value="N">N - Não ferrosos</option>
                                    <option value="S">S - Superligas e titânio</option>
                                    <option value="H">H - Aços endurecidos</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="fornecedor">Fornecedor:</label>
                                <select name="fornecedor" id="fornecedor" required>
                                    <option value="">Carregando...</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="quantidade">Quantidade: </label>
                                <input type="number" id="quantidade" name="quantidade" min="0" max="100" required>
                            </div>
                            <br>
                        </div>
                        <div class="row">
                            <button type="submit" id="btn-confirm">Adicionar</button>
                        </div>
                        <hr>
                        <br>
                        <div id="row-filtro">
                            <div class="form-group">
                                <label for="filtro">Filtro:</label>
                                <input type="text" id="filtro" name="filtro" placeholder="Digite o ID interno">
                            </div>
                            <button type="button" id="btn-filtro">Filtrar</button>
                        </div>
                        <br>
                        <hr>
                        <br>
                        <table>
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Codigo</th>
                                    <th>Classe</th>
                                    <th>Fornecedor</th>
                                    <th>Quantidade</th>
                                    <th>Ações</th>
                                </tr>
                            </thead>
                            <tbody id="body-table">
                            </tbody>
                        </table>
                    </form>
                </div>
            </div>
        </main>

    </div>
    <script src="../scripts/pastilha.js"></script>
</body>
</html>
