<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="../static/cadastro.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
</head>

<body>
    <!-- estrutura base das paginas  -->

      <aside class="sidebar">
        <div class="logo">
            <img src="/img/logo.png" alt="Logo" class="logo1">
            <h2 id="nome_sys">Stock System</h2>
        </div>

        <a href="/index.html">
            <svg viewBox="0 0 24 24">
                <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z" />
            </svg>
            <span>Início</span>
        </a>

        <a href="/templates/cadastro.html">
            <svg viewBox="0 0 24 24">
                <path
                    d="M12 2L3 7v10l9 5 9-5V7l-9-5zm0 2.3L18.5 8 12 11.7 5.5 8 12 4.3zM5 9.7l6 3.4v6.2l-6-3.4V9.7zm8 9.6v-6.2l6-3.4v6.2l-6 3.4z" />
                <path d="M19 14v2h2v2h-2v2h-2v-2h-2v-2h2v-2h2z" />
            </svg>
            <span>Entrada e <br> Saida </span>

            <a href="/templates/pastilha.html">
                <svg viewBox="0 0 24 24">
                    <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z" />
                </svg>
                <span>Cadastrar <br> Pastilha</span>
            </a>

        </a>

        <a href="/templates/fornecedor.html" class="logout">
            <svg viewBox="0 0 24 24">
                <path
                    d="M20 8h-3V4H3c-1.1 0-2 .9-2 2v11h2a3 3 0 0 0 6 0h6a3 3 0 0 0 6 0h2v-5l-3-4zm-3 1h2.5l2 3H17V9zM6 18.5a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zm12 0a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3z" />
            </svg>
            <span>Cadastrar <br> Fornecedores</span>
        </a>

        <a href="/templates/entradas-e-saidas.html">
            <svg viewBox="0 0 24 24">
                <path
                    d="M13 3a9 9 0 0 0-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42A8.954 8.954 0 0 0 13 21a9 9 0 0 0 0-18zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z" />
            </svg>
            <span>Histórico</span>
        </a>

        <a href="/templates/login.html" class="logout" id="sair">
            <svg viewBox="0 0 24 24">
                <path
                    d="M10.09 15.59L11.5 17l5-5-5-5-1.41 1.41L12.67 11H3v2h9.67l-2.58 2.59zM19 3H5c-1.11 0-2 .9-2 2v4h2V5h14v14H5v-4H3v4c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2z" />
            </svg>
            <span>Saída</span>
        </a>
        </nav>
    </aside>
    <!-- Menu do lado -->
    
    <div class="main-container">
        <header class="topbar">
            <div class="logo">
            </div>

            <div class="user-menu">
                <div class="badge-icon">
                    <span class="material-symbols-outlined">
                        notifications
                    </span>
                    <span class="count">
                        1
                    </span>
                </div>
                <div style="display: flex; align-items: center; gap: 4px; cursor: pointer;">
                    <span class="material-symbols-outlined">account_circle</span>
                    <span class="material-symbols-outlined" style="font-size: 16px;">arrow_drop_down</span>
                </div>
            </div>
        </header>
        <!-- estrutura base das paginas  -->
        <main class="main">

            <div class="area-de-interacao">
                <div class="tituloo">
                <h1 id="titulo">Cadastro de Entrada</h1>
                </div>
                <div id="area-form">
                    <form id="cadastro" action="https://6ab95468f84897980b728b5b.mockapi.io/api/pastilhas"
                        method="post">
                        <label for="cadastrante">Cadastrante:</label>
                        <br>
                        <input type="text" name="cadastrante" id="cadastrante"
                            placeholder="Digite o nome do cadastrante" required>
                        <br><br>
                        <label for="quantidade">Quantidade(pacote):</label>
                        <br>
                        <input type="number" min="1" max="100" name="quantidade" id="quantidade" placeholder="UND"
                            required>
                        <br><br>
                        <label for="fornecedor">Fornecedor:</label>
                        <br>
                        <select id="fornecedor" name="fornecedor">
                        </select>
                        <br><br>
                        <label for="classe">Classe:</label>
                        <br>
                        <select name="classe" id="classe">
                            
                        </select>
                        <br><br>
                        <label for="tipo">Tipo:</label>
                        <select id="tipo" name="tipo">
                            <option>Cadastro</option>
                            <option>Retirada</option>
                        </select>
                        <br><br>
                        <button type="submit">Finalizar</button>
                    </form>
                    <div class="cheque">
                        <p id="paragrafo-cadastrante">Cadastrante: </p>
                        <p id="paragrafo-data">Data: </p>
                        <p id="paragrafo-quantidade">Quantidade: </p>
                        <p id="paragrafo-valor-unidade">Valor por unidade: </p>
                        <p id="paragrafo-valor-pacote">Valor por pacote: </p>
                        <p id="paragrafo-valor-total">Valor total: </p>
                        <p id="paragrafo-fornecedor">Fornecedor:</p>
                        <p id="paragrafo-classe">Classe:</p>
                        <p id="paragrafo-tipo">Tipo:</p>
                    </div>
                </div>
            </div>
        </main>
        <script src="../scripts/cadastro.js"></script>
</body>

</html>
