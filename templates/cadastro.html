<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="../static/cadastro.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
</head>

<body>
    <!-- estrutura base das paginas  -->
    <!-- Menu do lado -->
    <aside class="sidebar">
        <span class="material-symbols-outlined menu-icon">
            menu
        </span>
        <a href="index.html" class="nav-item ativo" title="inicio">
            <span class="material-symbols-outlined">
                home
            </span>
        </a>
        <a href="templates/cadastro.html" class="nav-item" title="cadastro" id="item-2">
            <span class="material-symbols-outlined">
                create_new_folder
            </span>
        </a>
        <a href="templates/entradas-e-saidas.html" class="nav-item" title="Historico">
            <span class="material-symbols-outlined">
                overview
            </span>
        </a>
         <a href="templates/fornecedor.html" class="nav-item" title="Cadastrar fornecedor">
           <span class="material-symbols-outlined">
                 add
            </span>
        </a>


    </aside>
    <div class="main-container">
        <header class="topbar">
            <div class="logo">
                <span class="material-symbols-outlined">
                    settings
                </span>
                <img class="logo" src="../img/logo-dda.png" alt="logo">
            </div>

            <div class="search-box">
                <input placeholder="Pesquisar..." type="text">
                <span class="material-symbols-outlined">
                    search
                </span>
            </div>

            <div class="user-menu">
                <div class="badge-icon">
                    <span class="material-symbols-outlined">
                        notifications
                    </span>
                    <span class="count">
                        1
                    </span>
                </div>
                <div style="display: flex; align-items: center; gap: 4px; cursor: pointer;">
                    <span class="material-symbols-outlined">account_circle</span>
                    <span class="material-symbols-outlined" style="font-size: 16px;">arrow_drop_down</span>
                </div>
                <span class="material-symbols-outlined" style="cursor: pointer;">logout</span>
            </div>
        </header>
        <!-- estrutura base das paginas  -->
    <main class="main">
        
        <div class="area-de-interacao">
            <form id="cadastro" action="https://6ab95468f84897980b728b5b.mockapi.io/api/pastilhas" method="post">
                <label for="cadastrante">Cadastrante:</label>
                <br>
                <input type="text" name="cadastrante" id="cadastrante" placeholder="Digite o nome do cadastrante" required>
                <br><br>
                <label for="quantidade">Quantidade(pacote):</label>
                <br>
                <input type="number" min="1" max="100" name="quantidade" id="quantidade" placeholder="UND" required>
                <br><br>
                <label for="fornecedor">Fornecedor:</label>
                <br>
                <select id="fornecedor" name="fornecedor">
                    <option>Sandvik Coromant</option>
                    <option>Widia</option>
                    <option>Mitsubishi Materials</option>
                    <option>ZCC-CT</option>
                </select>
                <br><br>
                <label for="classe">Classe:</label>
                <br>
                <select name="classe" id="classe">
                    <option >P</option>
                    <option >M</option>
                    <option >K</option>
                    <option >N</option>
                    <option >S</option>
                    <option >H</option>
                </select>
                <br><br>
                <label for="tipo">Tipo:</label>
                <select id="tipo" name="tipo">
                    <option>Cadastro</option>
                    <option>Retirada</option>
                </select>
                <br><br>
                <button type="submit">Finalizar</button>
            </form>
            <div class="cheque">
                <img src="../img/logo-dda.png" alt="" width="100" height="50">
                <p id="paragrafo-cadastrante">Cadastrante: </p>
                <p id="paragrafo-data">Data: </p>
                <p id="paragrafo-quantidade">Quantidade: </p>
                <p id="paragrafo-valor-unidade">Valor por unidade: </p>
                <p id="paragrafo-valor-pacote">Valor por pacote: </p>
                <p id="paragrafo-valor-total">Valor total: </p>
                <p id="paragrafo-fornecedor">Fornecedor:</p>
                <p id="paragrafo-classe">Classe:</p>
                <p id="paragrafo-tipo">Tipo:</p>
            </div>
        </div>
    </main>
    <script src="../scripts/cadastro.js"></script>
</body>

</html>
